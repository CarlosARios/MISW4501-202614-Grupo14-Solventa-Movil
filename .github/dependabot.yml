version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    # El cliente web no lo fija, asi que sus PR de Dependabot apuntan a main.
    # Aqui apuntan a develop, que es lo que pide el flujo de trabajo.
    target-branch: develop
    commit-message:
      prefix: chore
    groups:
      androidx:
        patterns:
          - "androidx.*"
      pruebas:
        patterns:
          - "io.mockk:*"
          - "app.cash.turbine:*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
          - "junit:junit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: chore
